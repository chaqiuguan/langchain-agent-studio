[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-agent-studio"
version = "0.1.0"
description = "AgentStudio 智能体工坊 —— 基于 LangChain 的可扩展工具调用智能体"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "聂天一" }]
keywords = ["langchain", "agent", "llm", "react-agent", "streamlit", "tool-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langchain>=0.3.7,<0.4",
    "langchain-core>=0.3.15,<0.4",
    "langchain-openai>=0.2.8,<0.4",
    "python-dotenv>=1.0.1",
    "streamlit>=1.39",
    "ddgs>=9.0.0",
    "requests>=2.31",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
agentstudio = "agentstudio.cli:main"

[project.urls]
Homepage = "https://github.com/chaqiuguan/langchain-agent-studio"
Repository = "https://github.com/chaqiuguan/langchain-agent-studio"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["agentstudio"]
